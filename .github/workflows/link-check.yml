name: Link Check

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'  # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # 403, 415 and 429: publishers and DOI targets that refuse automated
      # requests, as in the demographyandme fleet's link checks.
      - name: Check links
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: >-
            --no-progress
            --timeout 30
            --max-retries 3
            --accept 200,403,415,429
            README.md data-raw/README.md
          fail: true
